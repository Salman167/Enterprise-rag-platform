name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install shared library
        run: pip install ./shared/python

      - name: Validate Python syntax
        run: |
          python -m compileall shared/python services -q

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build API Gateway image
        run: docker build -f services/api-gateway/Dockerfile .

      - name: Build Query Service image
        run: docker build -f services/query-service/Dockerfile .
